name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore FlowLedger.slnx
      - name: Build
        run: dotnet build FlowLedger.slnx --configuration Release --no-restore
      - name: Test accounting, lifecycle and Windows interop
        run: dotnet test --solution FlowLedger.slnx --configuration Release --no-build
      - name: Verify formatting
        run: dotnet format FlowLedger.slnx --verify-no-changes --no-restore
      - name: Smoke-test diagnostics
        run: dotnet run --project src/FlowLedger.Collector --configuration Release --no-build -- --diagnose
      - name: Smoke-test interface sampling
        run: dotnet run --project src/FlowLedger.Collector --configuration Release --no-build -- --sample 1
      - name: Verify SQLite transaction recovery
        run: dotnet run --project src/FlowLedger.Collector --configuration Release --no-build -- --verify-history
